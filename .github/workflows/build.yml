name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath .

          $ffmpegFolder = Get-ChildItem -Directory | Where-Object {
              $_.Name -like "ffmpeg-*"
          } | Select-Object -First 1

          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Move-Item "$($ffmpegFolder.FullName)\bin" ffmpeg\

      - name: Verify FFmpeg
        shell: powershell
        run: |
          Get-ChildItem -Recurse ffmpeg

      - name: Build with Nuitka
        shell: cmd
        run: |
          python -m nuitka ^
            --mode=standalone ^
            --output-dir=Clip2Mp3 ^
            --output-filename=Clip2Mp3.exe ^
            --enable-plugin=pyqt6 ^
            --windows-console-mode=disable ^
            --include-data-dir=ffmpeg=ffmpeg ^
            --assume-yes-for-downloads ^
            gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clip2Mp3-Windows
          path: Clip2Mp3/
          if-no-files-found: error
